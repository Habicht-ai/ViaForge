import xyz.wagyourtail.jvmdg.gradle.task.DowngradeJar
import xyz.wagyourtail.jvmdg.gradle.task.ShadeJar

plugins {
    id 'java-library'
    id 'net.raphimc.class-token-replacer' version '1.1.7'
    id 'xyz.wagyourtail.unimined' version '1.4.1'
    id 'com.gradleup.shadow' version '9.4.1'
    id 'xyz.wagyourtail.jvmdowngrader' version '1.3.6'
}

group = 'com.viaversion'
version = '4.4.0-client.1'

description = 'ViaForge for Minecraft Forge 1.8.9'
base { archivesName = 'ViaForge-1.8.9' }
java { toolchain.languageVersion = JavaLanguageVersion.of(21) }
tasks.withType(JavaCompile).configureEach {
    sourceCompatibility = '17'
    targetCompatibility = '17'
    options.encoding = 'UTF-8'
}
repositories {
    mavenCentral()
    maven { url = 'https://maven.minecraftforge.net/' }
    maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
    maven {
        url = 'https://repo.viaversion.com'
        // Modern Via libraries are converted to Java 8 during packaging.
        metadataSources { mavenPom(); artifact() }
    }
}
configurations {
    library
    implementation.extendsFrom(library)
    accountTestLibraries {
        canBeConsumed = false
        canBeResolved = true
    }
}
dependencies {
    library "com.viaversion:viaversion-common:${vv_version}"
    library "com.viaversion:viabackwards-common:${vb_version}"
    library "com.viaversion:viarewind-common:${vr_version}"
    library "com.viaversion:viaaprilfools-common:${vaf_version}"
    library("net.raphimc:ViaLegacy:${vl_version}") {
        exclude group: 'com.google.code.gson', module: 'gson'
    }
    compileOnly 'io.netty:netty-all:4.2.2.Final'
    library('org.spongepowered:mixin:0.7.10-SNAPSHOT') { exclude module: 'launchwrapper' }
    library 'org.slf4j:slf4j-api:2.0.17'
    accountTestLibraries 'junit:junit:4.13.2'
    accountTestLibraries 'com.google.code.gson:gson:2.2.4'
    accountTestLibraries 'org.apache.httpcomponents:httpclient:4.3.3'
    accountTestLibraries 'io.netty:netty-all:4.0.23.Final'
}

sourceSets.main.classTokenReplacer { property('\${version}', project.version) }

unimined.minecraft {
    version '1.8.9'
    minecraftForge {
        loader '11.15.1.2318-1.8.9'
        mixinConfig('mixins.viaforge.json')
    }
    mappings {
        searge()
        mcp('stable', '22-1.8.9')
    }
    remap(tasks.shadowJar) {
        prodNamespace('searge')
        mixinRemap { }
    }
    runs {
        config('client') {
            javaVersion = JavaVersion.VERSION_1_8
            workingDir file('run')
            // Forge 1.8.9 cannot read the original Java 17+ classes.
            // Run the complete downgraded development JAR with only game libraries.
            classpath = classpath - sourceSets.main.output - configurations.library + configurations.minecraftLibraries
            classpath = classpath.filter { !it.name.startsWith('annotations-') }
            // Coremods are skipped during classpath mod discovery. Install the
            // development JAR in mods so Forge also discovers its @Mod entry.
            dependsOn tasks.named('installDevelopmentJar')
        }
    }
}

// Login support is compiled separately and never enters the release pipeline.
sourceSets {
    development {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
    }
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'description', project.description
    filesMatching('mcmod.info') { expand version: project.version, description: project.description }
    from(file('LICENSE')) { into 'META-INF/viaforge' }
    from(file('docs/THIRD_PARTY_NOTICES.md')) { into 'META-INF/viaforge' }
}

jar {
    enabled = false
    manifest.attributes(
        'Implementation-Title': 'ViaForge 1.8.9 Client',
        'Implementation-Version': project.version,
        'FMLCorePlugin': 'com.viaversion.viaforge.mixin.MixinLoader',
        'FMLCorePluginContainsFMLMod': 'true',
        'ForceLoadAsMod': 'true',
        'TweakClass': 'org.spongepowered.asm.launch.MixinTweaker',
        'TweakOrder': '0',
        'MixinConfigs': 'mixins.viaforge.json'
    )
}
shadowJar {
    destinationDirectory = layout.buildDirectory.dir('intermediates/shadow')
    configurations = [project.configurations.library]
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    exclude 'META-INF/maven/**', 'META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA', 'META-INF/*.EC'
    // Forge's ASM 5 scanner reads every class, including Java 9+ module descriptors.
    exclude 'META-INF/versions/**', 'module-info.class'
    relocate 'org.slf4j', 'com.viaversion.viaforge.libs.slf4j'
}
downgradeJar {
    inputFile = tasks.named('remapShadowJar').flatMap { it.archiveFile }
    destinationDirectory = layout.buildDirectory.dir('intermediates/downgrade')
    downgradeTo = JavaVersion.VERSION_1_8
    logLevel = 'FATAL'
}
shadeDowngradedApi {
    destinationDirectory = layout.buildDirectory.dir('libs')
    archiveFileName = "ViaForge-1.8.9-${project.version}.jar"
    logLevel = 'FATAL'
}
tasks.register('developmentJar', Jar) {
    destinationDirectory = layout.buildDirectory.dir('intermediates/development')
    archiveClassifier = 'dev'
    manifest.attributes(tasks.jar.manifest.attributes)
    manifest.attributes('FMLCorePlugin': 'com.viaversion.viaforge.development.MovementProbeLoader')
    from(tasks.named('shadowJar').flatMap { it.archiveFile }.map { zipTree(it) }) {
        exclude 'META-INF/MANIFEST.MF'
    }
    from sourceSets.development.output
}

tasks.register('downgradeDevelopmentJar', DowngradeJar) {
    inputFile = tasks.named('developmentJar').flatMap { it.archiveFile }
    destinationDirectory = layout.buildDirectory.dir('intermediates/dev-downgrade')
    archiveClassifier = 'dev-downgraded'
    downgradeTo = JavaVersion.VERSION_1_8
    logLevel = 'FATAL'
}
tasks.register('shadeDevelopmentApi', ShadeJar) {
    inputFile = tasks.named('downgradeDevelopmentJar').flatMap { it.archiveFile }
    destinationDirectory = layout.buildDirectory.dir('development')
    archiveClassifier = 'dev-java8'
    logLevel = 'FATAL'
}
tasks.register('installDevelopmentJar', Copy) {
    from tasks.named('shadeDevelopmentApi').flatMap { it.archiveFile }
    into layout.projectDirectory.dir('run/mods')
    rename { 'ViaForge-development.jar' }
}
tasks.named('remapJar') { enabled = false }
tasks.named('assemble') { dependsOn tasks.named('shadeDowngradedApi') }
tasks.named('compileTestJava') {
    classpath = files(sourceSets.main.output, sourceSets.development.output, configurations.accountTestLibraries, configurations.library)
    sourceCompatibility = '8'
    targetCompatibility = '8'
    options.release = 8
}
tasks.named('test') {
    useJUnit()
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(8) }
    dependsOn tasks.named('shadeDevelopmentApi')
    // Exercise accounts and the block protocol/resource foundation on the game's JVM.
    classpath = files(sourceSets.test.output, tasks.named('shadeDevelopmentApi'), configurations.accountTestLibraries)
}

tasks.register('verifyReleaseJar') {
    group = 'verification'
    description = 'Checks Forge metadata, mixin mappings, Java 8 bytecode and absence of development accounts in the release JAR.'
    dependsOn tasks.named('shadeDowngradedApi')
    def artifact = tasks.named('shadeDowngradedApi').flatMap { it.archiveFile }
    inputs.file(artifact)
    doLast {
        new java.util.jar.JarFile(artifact.get().asFile).withCloseable { jarFile ->
            def attributes = jarFile.manifest.mainAttributes
            if (attributes.getValue('FMLCorePlugin') != 'com.viaversion.viaforge.mixin.MixinLoader'
                    || attributes.getValue('FMLCorePluginContainsFMLMod') != 'true') {
                throw new GradleException('Missing Forge coremod/mod registration')
            }
            for (String path : ['mcmod.info', 'mixins.viaforge.json', 'mixins.viaforge.refmap.json',
                    'com/viaversion/viaforge/ViaForge.class',
                    'com/viaversion/viaversion/ViaManagerImpl.class', 'META-INF/viaforge/LICENSE']) {
                if (jarFile.getEntry(path) == null) throw new GradleException("Missing packaged file: ${path}")
            }
            int count = 0
            jarFile.entries().each { entry ->
                if (entry.name.startsWith('com/viaversion/viaforge/account/')
                        || entry.name.startsWith('com/viaversion/viaforge/gui/account/')
                        || entry.name.startsWith('com/viaversion/viaforge/development/')) {
                    throw new GradleException("Development-only account code packaged in release: ${entry.name}")
                }
                if (entry.name.endsWith('.class')) {
                    jarFile.getInputStream(entry).withCloseable { stream ->
                        def data = new DataInputStream(stream)
                        data.readInt()
                        data.readUnsignedShort()
                        int major = data.readUnsignedShort()
                        if (major > 52) throw new GradleException("Forge cannot scan Java ${major - 44} class ${entry.name}")
                        count++
                    }
                }
            }
            logger.lifecycle("Release verified: ${count} Java 8-compatible classes, Forge registration and mixin mappings present, no development accounts.")
        }
    }
}
tasks.register('verifyDevelopmentJar') {
    group = 'verification'
    description = 'Checks that the development JAR contains account login support and Java 8 bytecode.'
    dependsOn tasks.named('shadeDevelopmentApi')
    def artifact = tasks.named('shadeDevelopmentApi').flatMap { it.archiveFile }
    inputs.file(artifact)
    doLast {
        new java.util.jar.JarFile(artifact.get().asFile).withCloseable { jarFile ->
            for (String path : ['com/viaversion/viaforge/development/DevelopmentAccounts.class',
                    'com/viaversion/viaforge/account/AccountManager.class',
                    'com/viaversion/viaforge/gui/account/AccountManagerGui.class']) {
                if (jarFile.getEntry(path) == null) throw new GradleException("Missing development file: ${path}")
            }
            jarFile.entries().each { entry ->
                if (entry.name.endsWith('.class')) {
                    jarFile.getInputStream(entry).withCloseable { stream ->
                        def data = new DataInputStream(stream)
                        data.readInt()
                        data.readUnsignedShort()
                        int major = data.readUnsignedShort()
                        if (major > 52) throw new GradleException("Forge cannot scan Java ${major - 44} class ${entry.name}")
                    }
                }
            }
            logger.lifecycle('Development JAR verified: account login support present, all classes Java 8-compatible.')
        }
    }
}

// The Forge smoke runner closes Minecraft normally even after an assertion.
// Require this invocation's report so a successful Java exit cannot hide FAIL
// or accidentally reuse an older PASS. Ordinary client launches are unaffected.
tasks.matching { it.name == 'runClient' }.configureEach {
    def reportPath = providers.environmentVariable('VIAFORGE_BLOCK_SMOKE_TEST').orNull
    if (reportPath) {
        def smokeReport = file(reportPath)
        long started = 0
        doFirst { started = System.currentTimeMillis() }
        doLast {
            if (!smokeReport.isFile() || smokeReport.lastModified() < started
                    || smokeReport.withReader('UTF-8') { it.readLine() } != 'PASS') {
                throw new GradleException("Forge smoke did not produce a fresh PASS: ${smokeReport}")
            }
            logger.lifecycle("Forge smoke report verified: PASS (${smokeReport})")
        }
    }
}

tasks.named('check') { dependsOn tasks.named('verifyReleaseJar'), tasks.named('verifyDevelopmentJar') }

tasks.register('sourceArchive', Zip) {
    archiveFileName = "ViaForge-1.8.9-${project.version}-sources.zip"
    destinationDirectory = layout.buildDirectory.dir('libs')
    includeEmptyDirs = false
    from(projectDir) {
        include 'src/**', 'gradle/**', 'docs/**'
        include 'tools/test-servers/*.py', 'tools/test-servers/*.json'
        include 'tools/test-servers/labac/**', 'tools/test-servers/native-probe/*.java'
        include '*.gradle', '*.properties', '*.bat', 'gradlew', 'README.md', 'LICENSE'
        include '.editorconfig', '.gitignore', '.github/workflows/build.yml'
    }
}
tasks.named('build') { dependsOn tasks.named('sourceArchive') }
